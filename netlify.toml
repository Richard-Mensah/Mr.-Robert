# Netlify build settings. These override whatever is typed into the Netlify dashboard,
# so a wrong "publish directory" or an old Node version there can't break the build.
# Netlify detects Next.js and adds its Next.js runtime automatically; no plugin needs installing.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The database scripts and Next.js 15 need a current Node; Netlify's default can lag behind.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
